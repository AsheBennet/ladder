services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ladder
      POSTGRES_PASSWORD: ladder
      POSTGRES_DB: ladder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladder -d ladder"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://ladder:ladder@db:5432/ladder
      PORT: "8080"
      SEASON_ID: "s1"
      PLACEHOLDER_HOST: "127.0.0.1"
      PLACEHOLDER_PORT_BASE: "40000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
